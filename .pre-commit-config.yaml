# Pre-commit is the preventative half of secret hygiene. See THREAT_MODEL.md
# "Phase 0" for the limits of this control.
#
# Tool choice note: the usual recommendation here is gitleaks. Its upstream
# pre-commit hook is `language: golang`, which would build it from source and
# needs a Go toolchain this machine lacks -- but gitleaks ships prebuilt static
# binaries, so the real prerequisite is the binary, not Go. If you install it,
# wire it as a `repo: local` hook with `language: system` rather than adding Go.
#
# Not installed, deliberately: detect-private-key + detect-secrets + ruff
# S105/S106/S107 caught all four attempts in the step 0 exercise
# (THREAT_MODEL.md F-01). gitleaks' marginal value here is its broader rule set
# and history scanning, and this history has no pre-hook window to audit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key # RSA/EC private keys; rlas generates these in step 3
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # PLAN.md step 3 commits RSA *public* keys and test fixtures. When a
        # finding is a deliberate fixture, audit it into the baseline with
        # `uv run detect-secrets audit .secrets.baseline` rather than widening
        # this exclude -- the baseline records the decision and who made it.
        exclude: ^(uv\.lock|\.secrets\.baseline)$
