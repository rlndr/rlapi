[alembic]
script_location = src/rlapi/migrations
prepend_sys_path = src
path_separator = os

# sqlalchemy.url is deliberately omitted. env.py resolves the target from
# $RLAPI_DATABASE_URL, falling back to sqlite:///rlapi.db. Keeping connection
# strings out of version control is habit-forming for step 18, where this
# would be a real credential.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
